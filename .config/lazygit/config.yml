customCommands:
  - key: <c-c>
    description: Pick AI commit
    command: aicommit2 --generate 5
    context: files
    subprocess: true
    showOutput: true
  - key: <c-n>
    description: Pick AI commit (no verify)
    command: aicommit2 --generate 5 --no-verify
    context: files
    subprocess: true
disableStartupPopups: true
